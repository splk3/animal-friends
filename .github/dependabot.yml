version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "npm"
      prefix-development: "npm-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    groups:
      # Group production dependency updates by family
      production-framework:
        dependency-type: "production"
        patterns:
          - "gatsby"
        update-types:
          - "minor"
          - "patch"
      production-react:
        dependency-type: "production"
        patterns:
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
      # Group development dependency updates by family
      development-babel:
        dependency-type: "development"
        patterns:
          - "@babel/*"
          - "babel-jest"
        update-types:
          - "minor"
          - "patch"
      development-styling:
        dependency-type: "development"
        patterns:
          - "@tailwindcss/*"
          - "autoprefixer"
          - "gatsby-plugin-postcss"
          - "postcss"
          - "tailwindcss"
        update-types:
          - "minor"
          - "patch"
      development-testing:
        dependency-type: "development"
        patterns:
          - "@testing-library/*"
          - "@types/jest"
          - "jest"
          - "jest-environment-jsdom"
        update-types:
          - "minor"
          - "patch"
      development-types:
        dependency-type: "development"
        patterns:
          - "@types/node"
          - "@types/react"
          - "@types/react-dom"
          - "typescript"
        update-types:
          - "minor"
          - "patch"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-build-tooling:
        patterns:
          - "actions/checkout"
          - "actions/setup-node"
        update-types:
          - "minor"
          - "patch"
      actions-pages:
        patterns:
          - "actions/deploy-pages"
          - "actions/upload-pages-artifact"
        update-types:
          - "minor"
          - "patch"
